name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Don't attach real documents, OCR caches, reports or screenshots of private pages.** Reproduce with the sample document (`python -m pdfscan demo sample.pdf`) or describe a fictional PDF. Report security problems privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the sample document
        2. Turn on Phone numbers
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PDF Scan version
      placeholder: "0.2.0 (python -m pdfscan --version)"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and browser
      placeholder: "Windows 11, Edge 141"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real personal or confidential information.
          required: true
