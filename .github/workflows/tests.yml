name: Synthetic regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OCR test fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-noto-cjk
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/prepare_release.py --audit-only --audit-git
      - run: python scripts/setup_ocr.py
      - run: python -m pytest -q --basetemp=.runtime/test-run
      - run: python -m build
      - run: python scripts/prepare_release.py --audit-only --dist-dir dist
